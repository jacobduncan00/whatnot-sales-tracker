<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 320px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Inter, Arial, sans-serif;
        text-align: left;
        background-color: #0f1115;
        color: #e6e6e6;
        margin: 0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: 0 0 10px;
      }
      .dot.on { background-color: #22c55e; }
      .dot.off { background-color: #ef4444; }
      .title {
        font-weight: 600;
        font-size: 16px;
        margin: 0;
      }
      .desc {
        color: #a3a3a3;
        font-size: 12px;
        margin-top: 4px;
      }
      .stats {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #151821;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 16px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .stat-label {
        color: #a3a3a3;
        font-size: 13px;
      }
      .stat-value {
        font-weight: 600;
        font-size: 15px;
        font-family: Poppins, Inter, system-ui, sans-serif;
      }
      .updated {
        color: #666;
        font-size: 11px;
        text-align: center;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #2a2f3a;
      }
      .error {
        color: #ef4444;
        font-size: 12px;
        margin-top: 8px;
        padding: 8px;
        background: rgba(239, 68, 68, 0.1);
        border-radius: 4px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="dot off" id="dot"></span>
      <div style="flex: 1;">
        <div id="title" class="title">Checking current tab…</div>
        <div id="desc" class="desc"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat-row">
        <span class="stat-label">Total Sales</span>
        <strong id="gross" class="stat-value">$0.00</strong>
      </div>
      <div class="stat-row">
        <span class="stat-label">Est. After Fees</span>
        <strong id="net" class="stat-value">$0.00</strong>
      </div>
      <div class="stat-row">
        <span class="stat-label">Items Sold</span>
        <strong id="count" class="stat-value">0</strong>
      </div>
      <div id="updated" class="updated">—</div>
    </div>
    <div id="error" class="error"></div>
    <script src="popup.js"></script>
  </body>
</html>
