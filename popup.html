<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 320px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Inter, Arial, sans-serif;
        text-align: left;
        background-color: #0f1115;
        color: #e6e6e6;
        margin: 0;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: 0 0 10px;
      }
      .dot.on { background-color: #22c55e; }
      .dot.off { background-color: #ef4444; }
      .title {
        font-weight: 600;
        font-size: 16px;
        margin: 0;
      }
      .desc {
        color: #a3a3a3;
        font-size: 12px;
        margin-top: 4px;
      }
      .stats {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #151821;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 16px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .stat-label {
        color: #a3a3a3;
        font-size: 13px;
      }
      .stat-value {
        font-weight: 600;
        font-size: 15px;
        font-family: Poppins, Inter, system-ui, sans-serif;
      }
      .updated {
        color: #666;
        font-size: 11px;
        text-align: center;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #2a2f3a;
      }
      .error {
        color: #ef4444;
        font-size: 12px;
        margin-top: 8px;
        padding: 8px;
        background: rgba(239, 68, 68, 0.1);
        border-radius: 4px;
        display: none;
      }
      
      /* Top Spenders Section */
      .spenders-section {
        margin-top: 16px;
        background: #151821;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 16px;
        display: none;
      }
      .spenders-title {
        font-weight: 700;
        font-size: 14px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .spenders-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .spender-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #2a2f3a;
        font-size: 13px;
      }
      .spender-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .spender-item:first-child {
        padding-top: 0;
      }
      .rank {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #2a2f3a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 11px;
        flex-shrink: 0;
      }
      .rank.gold { background: linear-gradient(135deg, #ffd700, #b8860b); color: #000; }
      .rank.silver { background: linear-gradient(135deg, #c0c0c0, #808080); color: #000; }
      .rank.bronze { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #fff; }
      .username {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #e6e6e6;
      }
      .amount {
        font-weight: 600;
        color: #22c55e;
        white-space: nowrap;
      }
      .item-count {
        color: #666;
        font-size: 11px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="dot off" id="dot"></span>
      <div style="flex: 1;">
        <div id="title" class="title">Checking current tab…</div>
        <div id="desc" class="desc"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat-row">
        <span class="stat-label">Total Sales</span>
        <strong id="gross" class="stat-value">$0.00</strong>
      </div>
      <div class="stat-row">
        <span class="stat-label">Est. After Fees</span>
        <strong id="net" class="stat-value">$0.00</strong>
      </div>
      <div class="stat-row">
        <span class="stat-label">Items Sold</span>
        <strong id="count" class="stat-value">0</strong>
      </div>
      <div id="updated" class="updated">—</div>
    </div>
    <div id="spenders-section" class="spenders-section">
      <div class="spenders-title">Top 5 Spenders</div>
      <ul id="spenders-list" class="spenders-list"></ul>
    </div>
    <div id="error" class="error"></div>
    <script src="popup.js"></script>
  </body>
</html>
