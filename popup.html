<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 280px;
        padding: 14px 16px;
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Inter, Arial, sans-serif;
        text-align: left;
        background-color: #0f1115;
        color: #e6e6e6;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #151821;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 12px 14px;
        line-height: 1.35;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: 0 0 10px;
      }
      .dot.on { background-color: #22c55e; }
      .dot.off { background-color: #ef4444; }
      .title { font-weight: 600; }
      .desc { color: #a3a3a3; font-size: 12px; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="status" class="status">
      <span class="dot off" id="dot"></span>
      <div>
        <div id="title" class="title">Checking current tab…</div>
        <div id="desc" class="desc"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
